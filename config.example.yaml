listen:
  host: 0.0.0.0
  port: 8545

upstreams:
  - name: node-a
    url: http://127.0.0.1:18545
    # WebSocket 端点；不配则按 url 推导（http→ws, https→wss）
    # wsUrl: ws://127.0.0.1:18546
    weight: 2
  - name: node-b
    url: http://127.0.0.1:28545
    weight: 1

# 期望的链 ID（如 1 = 以太坊主网）。配置后，报告其他 chainId 的节点会被摘除；
# 不配置则自动采用多数节点的 chainId 作为基准。
# chainId: 1

health:
  pollIntervalMs: 5000      # 健康轮询间隔
  requestTimeoutMs: 10000   # 上游请求超时
  maxBlockLag: 5            # 落后池内最大高度超过此值则摘除
  failureThreshold: 3       # 连续失败次数达到此值则摘除
  maxRetries: 2             # 单请求最多尝试的上游数
  retryBaseDelayMs: 100     # 重试退避基数：第 n 次重试延迟 base * 2^(n-1)
  retryMaxDelayMs: 1000     # 重试退避上限

security:
  # 直接拒绝的 RPC 命名空间（公网入口加固）
  blockedNamespaces: [admin, personal, debug, trace, miner, txpool]
  maxBatchSize: 100         # 单个批量请求最大元素数
  maxBodyBytes: 1048576     # 请求体大小上限（1MB）
  maxLogsRange: 10000       # eth_getLogs 最大区块跨度

cache:
  backend: memory           # memory | redis（可扩展其他后端）
  shortTtlMs: 2000          # 链头相关数据的短 TTL（dynamicTtl 开启时作为上限与初始回退值）
  pendingTtlMs: 1000        # 未打包交易收据等的极短 TTL
  dynamicTtl: true          # 按观测到的出块间隔动态调整短 TTL（间隔/4，钳制在 [minTtlMs, shortTtlMs]）
  minTtlMs: 200             # 动态 TTL 下限
  finalityDepth: 64         # 区块号 ≤ 链头 - finalityDepth 视为不可变，永久缓存

  memory:
    maxEntries: 100000

  # backend: redis 时启用：
  # redis:
  #   url: redis://127.0.0.1:6379
  #   keyPrefix: "ethproxy:"
